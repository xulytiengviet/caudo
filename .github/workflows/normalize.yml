name: Normalize original Bitcoin Puzzle dossier
on:
  push:
    paths:
      - 'scripts/build_dataset.py'
      - '.github/workflows/normalize.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3 1 * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sanitized dataset from archival source
        run: python scripts/build_dataset.py
      - name: Validate record count, required keys and safety
        run: |
          python - <<'PY'
          import json
          j=json.load(open('data/puzzles.json'))
          assert len(j['puzzles'])==256
          assert len({r['puzzle_id'] for r in j['puzzles']})==256
          keys={'puzzle_id','category','created_at','announced_at','address','funding_txid','reward_btc','status','source_url','solution_evidence','github_repos','last_verified_at'}
          assert all(keys.issubset(r) for r in j['puzzles'])
          assert all(not any(x in r for x in ('key_hex','wif_compressed','nonce_k','key_decimal')) for r in j['puzzles'])
          PY
      - name: Commit index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzles.json
          if ! git diff --cached --quiet; then git commit -m "data: refresh sanitized 256-puzzle source index"; git push; fi
